<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyBridge · Connect</title>
<!-- Reference your manual image upload here -->
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css?v=r3">
</head>
<body>

<!-- Background Art Layer (Subtle Mountains) -->
<div class="bg-mountains"></div>

<!-- LOGIN CONTAINER (Centered) -->
<main id="login-wrapper">
  <div class="login-card">
    
    <!-- HEADER -->
    <header class="login-header">
      <!-- REPLACE 'logo.png' WITH YOUR UPLOADED FILENAME IF DIFFERENT -->
      <img src="logo.png" alt="PyBridge Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1>Welcome to PyBridge</h1>
      <p class="subtitle">From AI Chats → To Your GitHub</p>
    </header>

    <!-- FORM -->
    <form id="auth-form">
      <div class="input-group">
        <label for="pat-input">GitHub Personal Access Token</label>
        <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxx..." autocomplete="off" required>
        <div class="helper-text">
          <span>Requires <code>repo</code> scope to create commits.</span>
        </div>
      </div>
      
      <button type="submit" id="connect-btn" class="btn-primary">
        Connect Account
      </button>
    </form>

    <!-- INSTRUCTIONS -->
    <details class="instructions">
      <summary>How do I get a token?</summary>
      <ol>
        <li>Go to <a href="https://github.com/settings/tokens/new" target="_blank">GitHub Developer Settings</a>.</li>
        <li>Note: "PyBridge", Expiration: 90 days.</li>
        <li>Select scope: <strong>repo</strong> (Full control).</li>
        <li>Click "Generate token" and paste it above.</li>
      </ol>
    </details>

    <!-- STATUS MESSAGE -->
    <div id="status-msg" class="status hidden"></div>
  </div>
</main>

<script src="app.js?v=r3"></script>
</body>
</html>
