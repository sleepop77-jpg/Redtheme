<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Circle (Sand) -->
  <circle cx="32" cy="32" r="32" fill="#E8E1D1"/>
  
  <!-- Bridge Structure Group (Olive Charcoal) -->
  <g stroke="#3E4A36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Truss Legs -->
    <path d="M12 52 L32 18 L52 52" stroke-width="5"/>
    
    <!-- Inner Support Beams (X Pattern) -->
    <path d="M20 40 L32 28 L44 40" stroke-width="4"/>
    <path d="M26 34 L32 40 L38 34" stroke-width="4"/>
    
    <!-- Horizontal Deck/Base -->
    <line x1="8" y1="52" x2="56" y2="52" stroke-width="5"/>
    
    <!-- Vertical Pillars connecting deck to arch -->
    <line x1="20" y1="52" x2="20" y2="40" stroke-width="3"/>
    <line x1="44" y1="52" x2="44" y2="40" stroke-width="3"/>
  </g>

  <!-- The Flag on Top (Green Accent) -->
  <g transform="translate(32, 18)">
    <!-- Pole -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#3E4A36" stroke-width="2" stroke-linecap="round"/>
    <!-- Flag Cloth -->
    <path d="M0 -12 Q 8 -9 14 -12 L 14 -4 Q 8 -1 0 -4 Z" fill="#7DA87A"/>
  </g>
</svg>